services:
  mariadb:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpipassword
    volumes:
      - mariadb_data:/var/lib/mysql

  glpi:
    image: diouxx/glpi
    ports:
      - "8080:80"
    environment:
      MYSQL_HOST: mariadb
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: glpipassword
      TZ: Africa/Johannesburg
      PHP_TZ: Africa/Johannesburg
    depends_on:
      - mariadb
    volumes:
      - glpi_data:/var/www/html/glpi
      - ./glpi_config/local_define.php:/var/www/html/glpi/config/local_define.php

  ticket-router:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - glpi
    env_file:
      - .env
    volumes:
      - ./data:/app/data

volumes:
  mariadb_data:
  glpi_data: